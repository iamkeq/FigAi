<!doctype html>
<meta charset="utf-8">
<title>FigAI Tab Bridge</title>
<style>
  body { font: 15px system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font: inherit; }
  button { margin-top: 20px; padding: 8px 16px; font: inherit; }
  #status { margin-top: 12px; color: #2e7d32; min-height: 1.2em; }
  p.hint { color: #555; font-size: 13px; margin: 4px 0 0; }
</style>
<h1>FigAI Tab Bridge</h1>
<p>Connects Chrome to the FigAI running on this computer. Nothing leaves this machine.</p>
<label for="token">Token</label>
<input id="token" type="password" autocomplete="off" placeholder="Same value as BROWSER_BRIDGE_TOKEN in FigAI's .env">
<label for="port">Port</label>
<input id="port" type="number" placeholder="8765">
<p class="hint">Must match browser_bridge_port in FigAI's config.yaml (default 8765).</p>
<button id="save">Save</button>
<div id="status"></div>
<script src="options.js"></script>
