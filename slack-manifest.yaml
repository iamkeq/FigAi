display_information:
  name: FigAI
  description: Fig -- a personal background AI assistant
  background_color: "#8e44ad"
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
      - im:write
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
