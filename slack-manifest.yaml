display_information:
  name: FigAI
  description: Fig -- a personal background AI assistant
  background_color: "#8e44ad"
features:
  bot_user:
    display_name: FigAI
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
      - im:write
      - files:write
      - app_mentions:read
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - message.channels
      - message.groups
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
