[project]
name = "figai"
version = "0.1.0"
description = "Fig: a personal background AI assistant for Windows"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "slack-bolt>=1.20",
    "mss>=9.0",
    "psutil>=6.0",
    "pillow>=10.4",
    "pystray>=0.19",
    "paramiko>=3.4",
    "requests>=2.32",
    "pyperclip>=1.9",
    "obsws-python>=1.7",
    "winotify>=1.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["figai*"]
