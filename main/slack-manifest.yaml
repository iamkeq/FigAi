display_information:
  name: FigAi
  description: A private, local Slack assistant
  background_color: "#202124"
features:
  bot_user:
    display_name: FigAi
    always_online: false
  slash_commands:
    - command: /figai
      description: Show FigAi's available skills
      usage_hint: show skills | model [provider/model | reset]
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - channels:history
      - groups:history
      - channels:read
      - groups:read
      - users:read
      - files:read
      - files:write
      - commands
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
