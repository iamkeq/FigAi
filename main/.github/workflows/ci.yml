name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: figai-macos
          - os: ubuntu-latest
            artifact: figai-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bash -n scripts/*.sh
      - run: bun run check
      - run: bun test --timeout 10000
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/figai
          if-no-files-found: error

  linux-arm64-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build:linux:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: figai-linux-arm64
          path: dist/figai
          if-no-files-found: error
